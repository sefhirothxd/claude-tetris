<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀️ Claro</button>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">RECORDS</p>
        <table class="records-table">
          <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr></thead>
          <tbody id="start-records"></tbody>
        </table>
        <p class="bests">Mejor combo: <b id="start-best-combo">0</b> · Líneas máx: <b id="start-best-lines">0</b></p>
        <button id="start-btn" class="primary-btn" type="button">Jugar</button>
        <button id="start-reset-btn" class="link-btn" type="button">Borrar records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-form" class="name-form hidden">
          <label for="name-input">¡Nuevo record! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" value="Jugador" autocomplete="off" />
            <button id="save-btn" type="button">Guardar</button>
          </div>
        </div>
        <table class="records-table">
          <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr></thead>
          <tbody id="overlay-records"></tbody>
        </table>
        <p class="bests">Mejor combo: <b id="overlay-best-combo">0</b> · Líneas máx: <b id="overlay-best-lines">0</b></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="overlay-reset-btn" class="link-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
